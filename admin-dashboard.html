<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员仪表板 - 宝通环保设备公司</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #1f2937;
            font-size: 2em;
        }
        
        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
        
        .dashboard {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .dashboard h2 {
            color: #1f2937;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        .user-info {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .user-info p {
            margin-bottom: 10px;
            color: #374151;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #7c3aed;
        }
        
        .stat-card h3 {
            color: #1f2937;
            margin-bottom: 10px;
        }
        
        .stat-card p {
            color: #6b7280;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .action-btn {
            background: #f3f4f6;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .action-btn:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            color: white;
        }
        
        .action-btn.primary:hover {
            background: linear-gradient(135deg, #6d28d9 0%, #9333ea 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏭 管理员仪表板</h1>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
        
        <div class="dashboard">
            <h2>欢迎回来！</h2>
            
            <div class="user-info">
                <p><strong>用户：</strong><span id="username">admin</span></p>
                <p><strong>角色：</strong><span id="role">管理员</span></p>
                <p><strong>登录时间：</strong><span id="loginTime">2026-11-01 09:00:00</span></p>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>👥 用户总数</h3>
                    <p>1</p>
                </div>
                <div class="stat-card">
                    <h3>📝 新闻数量</h3>
                    <p>5</p>
                </div>
                <div class="stat-card">
                    <h3>🏷️ 产品数量</h3>
                    <p>12</p>
                </div>
                <div class="stat-card">
                    <h3>📊 今日访问</h3>
                    <p>156</p>
                </div>
            </div>
            
            <h3>快速操作</h3>
            <div class="actions-grid">
                <button class="action-btn primary" onclick="location.href='/index.html'">返回主页</button>
                <button class="action-btn" onclick="manageUsers()">用户管理</button>
                <button class="action-btn" onclick="manageNews()">新闻管理</button>
                <button class="action-btn" onclick="manageProducts()">产品管理</button>
                <button class="action-btn" onclick="viewStats()">查看统计</button>
                <button class="action-btn" onclick="exportData()">导出数据</button>
            </div>
        </div>
    </div>
    
    <script>
        // 检查会话
        function checkSession() {
            const sessionToken = localStorage.getItem('admin_session');
            if (!sessionToken) {
                location.href = '/index.html';
                return;
            }
            
            fetch('/api/verify-session', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    session_token: sessionToken
                })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.success) {
                    location.href = '/index.html';
                }
            })
            .catch(error => {
                console.error('会话验证失败:', error);
                location.href = '/index.html';
            });
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('admin_session');
            localStorage.removeItem('admin_user');
            location.href = '/index.html';
        }
        
        // 管理功能
        function manageUsers() {
            alert('用户管理功能开发中...');
        }
        
        function manageNews() {
            alert('新闻管理功能开发中...');
        }
        
        function manageProducts() {
            alert('产品管理功能开发中...');
        }
        
        function viewStats() {
            alert('统计功能开发中...');
        }
        
        function exportData() {
            alert('数据导出功能开发中...');
        }
        
        // 页面加载时检查会话
        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
            
            // 设置登录时间
            document.getElementById('loginTime').textContent = new Date().toLocaleString();
        });
    </script>
</body>
</html>
